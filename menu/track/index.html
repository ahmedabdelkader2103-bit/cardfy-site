<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>متابعة الطلب — CARDfy</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/menu/track/track.css"></head><body><main class="track-wrap"><a class="back" href="javascript:history.back()">← رجوع</a><section class="card"><div id="loading">جاري تحميل حالة الطلب...</div><div id="error" class="error" hidden></div><div id="content" hidden><div class="head"><div><small>رقم الطلب</small><h1 id="ref"></h1></div><span id="statusBadge"></span></div><div id="tableInfo" class="table-info" hidden></div><div id="timeline" class="timeline"></div><div id="summary" class="summary"></div><div id="receiptConfirm" class="rating" hidden><h3>تأكيد استلام الطلب</h3><p>سجّل المندوب التسليم بدون رمز OTP. أكد الاستلام أو أخبر المطعم فورًا.</p><button data-received="true">استلمت الطلب</button><button data-received="false">لم أستلم الطلب</button><div id="receiptStatus"></div></div><div id="issue" class="issue" hidden>يوجد تنبيه مسجل على الطلب. المطعم يتابع الحالة.</div><div id="reportIssueBox" class="rating" hidden><h3>في مشكلة في الطلب؟</h3><textarea id="issueText" maxlength="1000" placeholder="اكتب المشكلة بوضوح ليظهر البلاغ لفريق المطعم"></textarea><button id="sendIssue">إرسال للمطعم</button><div id="issueStatus"></div></div><div id="ratingBox" class="rating" hidden><h3>قيّم تجربتك</h3><div class="stars" id="stars"></div><textarea id="feedback" maxlength="1000" placeholder="ملاحظتك (اختياري)"></textarea><button id="sendRating">إرسال التقييم</button><div id="ratingStatus"></div></div></div></section></main><script src="/menu/track/track.js?v=20260913-receipt"></script><script src="/menu/track/issue.js"></script><script src="/menu/track/track-demo-support.js"></script><script src="/menu/track/master-tracking.js"></script></body></html>
