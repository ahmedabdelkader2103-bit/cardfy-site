<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Staff POS — CARDfy</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/dashboard/menu/pos.css"></head><body><header class="pos-top"><button id="backBtn">←</button><div><b id="restaurantName">CARDfy POS</b><small id="staffName"></small></div><div class="pos-top-actions"><select id="source"><option value="pos">POS</option><option value="phone">طلب هاتفي</option></select><button id="clearOrder">طلب جديد</button></div></header><main class="pos-layout"><section class="products-pane"><div class="pos-search"><input id="search" placeholder="ابحث عن منتج..."><div id="cats" class="pos-cats"></div></div><div id="products" class="pos-products"></div></section><aside id="addonsPanel" class="addons-panel"><div class="panel-empty">اختَر منتجًا لعرض الاختيارات.</div></aside><aside class="order-pane"><div class="order-head"><h2>الطلب الحالي</h2><span id="lineCount">0</span></div><div class="order-config"><div class="seg" id="types"></div><select id="tableSelect" hidden><option value="">اختر الترابيزة</option></select><input id="customerName" placeholder="اسم العميل" hidden><input id="phone" placeholder="الهاتف" hidden><input id="address" placeholder="العنوان" hidden><select id="zone" hidden><option value="">منطقة التوصيل</option></select></div><div id="orderLines" class="order-lines"></div><div class="order-total"><span>الإجمالي المبدئي</span><b id="total">0 ج.م</b></div><button id="sendOrder" class="send-order">حفظ وإرسال الطلب</button><div id="status" class="pos-status"></div></aside></main><div id="toast" class="toast"></div><script src="/menu/staff/staff-pos.js"></script><script src="/menu/staff/staff-pos-commerce-patch.js"></script></body></html>
