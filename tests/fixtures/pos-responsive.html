<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CARDfy responsive regression fixture</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/restaurant/shared.css">
<link rel="stylesheet" href="/restaurant/finance.css">
<link rel="stylesheet" href="/restaurant/owner.css">
<link rel="stylesheet" href="/restaurant/kitchen.css">
<link rel="stylesheet" href="/restaurant/pos.css">
<link rel="stylesheet" href="/restaurant/pos-ui/main.css">
<link rel="stylesheet" href="/restaurant/pos-island.css">
</head><body class="lovable-pos-active"><div id="lovablePosRoot"></div>
<script type="module">
const params=new URLSearchParams(location.search),long=params.get('cart')==='long',delivery=params.get('mode')==='delivery';
if(params.has('baseline'))document.querySelector('link[href="/restaurant/pos-ui/main.css"]').href='/baseline/main.css';
const {mount}=await import(params.has('baseline')?'/baseline/entry.js':'/restaurant/pos-ui/entry.js');
const modifier='إضافة صوص وثوم ومخلل وخضروات طازجة بدون فلفل حار '.repeat(5);
const zoneName=params.has('longZone')?'منطقة التوصيل البعيدة بجوار الجامعة والطريق الرئيسي '.repeat(params.has('stressZone')?6:2):'المنطقة الأولى';
sessionStorage.setItem('cardfy_pos_draft:responsive:branch',JSON.stringify({
 orderType:delivery?'delivery':'pickup',notes:'ملاحظات اختبار التخطيط',
 customer:{name:'عميل اختبار',phone:'01012345678',zoneId:'zone',address:'عنوان اختبار كامل',notes:''},
 lines:long?Array.from({length:12},(_,i)=>({id:`fixture-${i}`,productId:'product',quantity:1,selections:{'option:extras':['option']}})):[],
}));
mount(document.getElementById('lovablePosRoot'),{
 context:{token:'fixture-not-a-real-token',client_id:'responsive',name:'موظف الاختبار',role:'staff'},branchId:'branch',
 snapshot:{orders:[],catalog:{settings:{delivery_enabled:true,payment_methods:['cash','pay_on_delivery']},
 categories:[{id:'category',name_ar:'منتجات اختبار'}],
 products:[{id:'product',name_ar:'منتج اختبار',available:true,base_price:85,category_id:'category',variants:[],
 option_groups:[{id:'extras',name:'الإضافات',required:false,min_select:0,max_select:1,options:[{id:'option',name:modifier,price_delta:5}]}]}],
 delivery_zones:[{id:'zone',name:zoneName,fee:20,branch_id:'branch'}]}},
 rpc:async()=>{throw new Error('Responsive fixture must never submit an order or call Production');},
 status:()=>{},customerHandoff:()=>'',onMenu:()=>{},onBell:()=>{},
});
</script></body></html>
