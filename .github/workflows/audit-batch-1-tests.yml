name: CARDfy Restaurant OS Regression Tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'client-dashboard.html'
      - 'dashboard/menu/**'
      - 'restaurant/**'
      - 'delivery-ui/**'
      - 'analytics/**'
      - 'analytics-ui/**'
      - 'menu/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/audit-batch-1-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix delivery-ui
      - run: npm run build --prefix delivery-ui
      - run: npm ci --ignore-scripts --prefix analytics-ui
      - run: npm run build --prefix analytics-ui
      - run: npm test
