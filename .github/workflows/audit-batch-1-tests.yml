name: Audit Batch 1 Regression Tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'client-dashboard.html'
      - 'dashboard/menu/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/audit-batch-1-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
