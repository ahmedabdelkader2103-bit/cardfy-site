name: Professional Menu Frontend Check

on:
  pull_request:
    paths:
      - 'dashboard/menu/**'
      - 'menu/**'
      - '.github/workflows/professional-menu-syntax.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find dashboard/menu menu -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
