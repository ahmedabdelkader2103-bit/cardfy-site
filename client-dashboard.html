<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardfy — دخول العميل</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;background:#f5f6fb;color:#1d2233}.wrap{max-width:860px;margin:0 auto;padding:28px}.card{background:#fff;border:1px solid #e7e9f2;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(25,30,55,.06)}h1{margin:0 0 8px}.muted{color:#7b8499}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:18px}.service{display:block;text-decoration:none;color:inherit;border:1px solid #e7e9f2;border-radius:16px;padding:18px;background:#fff}.service b{display:block;margin-bottom:6px}.service.off{opacity:.45;pointer-events:none}.login{max-width:440px;margin:10vh auto}.fld{margin:12px 0}.fld label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.fld input{width:100%;padding:12px 14px;border:1px solid #dfe2ec;border-radius:10px;font:inherit}.btn{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;background:#6d4df6;color:#fff}.btn.ghost{background:#eef0ff;color:#5a45db}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.err{display:none;color:#c8324b;background:#fff0f3;padding:10px;border-radius:10px;margin-top:10px}
</style>
</head>
<body><div id="app"></div>
<script>
const SUPA_URL='https://ytixcczbjmjnuotzavbb.supabase.co';
const SUPA_KEY='sb_publishable_0j9jf0boDrMGGO8S6mw-4Q_5bOeHIuU';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const TOKEN_KEY='cardfy_client_token_v1';
const SERVICES={social:['Social Link','/dashboard/social/'],menu:['Professional Menu','/dashboard/menu/'],shop:['Professional Shop','/dashboard/shop/'],booking:['Professional Booking','/dashboard/booking/']};
const app=document.getElementById('app');
function loginUI(msg=''){app.innerHTML=`<div class="wrap"><div class="card login"><h1>دخول عميل Cardfy</h1><p class="muted">استخدم كود العميل وكلمة المرور التي استلمتها من Cardfy.</p><div class="fld"><label>كود العميل</label><input id="code" placeholder="QBL-0001" dir="ltr"></div><div class="fld"><label>كلمة المرور</label><input id="pass" type="password" dir="ltr"></div><button class="btn" onclick="login()">دخول</button><div id="err" class="err" style="display:${msg?'block':'none'}">${msg}</div></div></div>`}
async function login(){const code=document.getElementById('code').value.trim(),p_password=document.getElementById('pass').value;const {data,error}=await sb.rpc('cfy_client_login',{p_code:code,p_password});if(error){loginUI('الكود أو كلمة المرور غير صحيحة، أو الحساب موقوف.');return}localStorage.setItem(TOKEN_KEY,data.token);renderHome(data)}
async function restore(){const token=localStorage.getItem(TOKEN_KEY);if(!token){loginUI();return}const {data,error}=await sb.rpc('cfy_client_session',{p_token:token});if(error){localStorage.removeItem(TOKEN_KEY);loginUI();return}renderHome(data)}
function renderHome(data){const c=data.client,active=new Set(data.services||[]);app.innerHTML=`<div class="wrap"><div class="top"><div><h1>${c.brand_name_ar||c.brand_name_en||c.code}</h1><div class="muted">${c.code} · ${c.business_type||''}</div></div><button class="btn ghost" onclick="logout()">تسجيل الخروج</button></div><div class="card" style="margin-top:18px"><b>خدماتك</b><div class="grid">${Object.entries(SERVICES).map(([k,v])=>`<a class="service ${active.has(k)?'':'off'}" href="${v}"><b>${v[0]}</b><span class="muted">${active.has(k)?'الخدمة مفعلة':'الخدمة غير مفعلة'}</span></a>`).join('')}</div></div></div>`}
async function logout(){const token=localStorage.getItem(TOKEN_KEY);if(token)await sb.rpc('cfy_client_logout',{p_token:token});localStorage.removeItem(TOKEN_KEY);loginUI()}
restore();
</script></body></html>
