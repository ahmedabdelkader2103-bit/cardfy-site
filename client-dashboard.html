<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardfy — دخول العميل</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;background:#f5f6fb;color:#1d2233}.wrap{max-width:860px;margin:0 auto;padding:28px}.card{background:#fff;border:1px solid #e7e9f2;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(25,30,55,.06)}h1{margin:0 0 8px}.muted{color:#7b8499}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:18px}.service{display:block;text-decoration:none;color:inherit;border:1px solid #e7e9f2;border-radius:16px;padding:18px;background:#fff}.service b{display:block;margin-bottom:6px}.login{max-width:440px;margin:10vh auto}.fld{margin:12px 0}.fld label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.fld input{width:100%;padding:12px 14px;border:1px solid #dfe2ec;border-radius:10px;font:inherit}.btn{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;background:#6d4df6;color:#fff}.btn.ghost{background:#eef0ff;color:#5a45db}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.err{display:none;color:#c8324b;background:#fff0f3;padding:10px;border-radius:10px;margin-top:10px}.admin-banner{background:#fff7db;color:#7a5b00;border:1px solid #f1df9b;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:13px;font-weight:700}.empty{padding:18px 0 4px;text-align:center;color:#7b8499}
</style>
</head>
<body><div id="app"></div>
<script>
const SUPA_URL='https://ytixcczbjmjnuotzavbb.supabase.co';
const SUPA_KEY='sb_publishable_0j9jf0boDrMGGO8S6mw-4Q_5bOeHIuU';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const TOKEN_KEY='cardfy_client_token_v1';
const SERVICES={social:['Social Link','/dashboard/social/'],menu:['Professional Menu','/dashboard/menu/'],shop:['Professional Shop','/dashboard/shop/'],booking:['Professional Booking','/dashboard/booking/']};
const app=document.getElementById('app');
const adminMode=new URLSearchParams(location.search).get('admin')==='1';
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function loginUI(msg=''){app.innerHTML=`<div class="wrap"><div class="card login"><h1>دخول عميل Cardfy</h1><p class="muted">استخدم كود العميل وكلمة المرور التي استلمتها من Cardfy.</p><div class="fld"><label>كود العميل</label><input id="code" placeholder="QBL-0001" dir="ltr" autocomplete="username"></div><div class="fld"><label>كلمة المرور</label><input id="pass" type="password" dir="ltr" autocomplete="current-password"></div><button class="btn" onclick="login()">دخول</button><div id="err" class="err" style="display:${msg?'block':'none'}">${escapeHtml(msg)}</div></div></div>`}
function loginMessage(data){if(data?.error==='too_many_attempts')return 'محاولات دخول كثيرة. حاول مرة أخرى بعد حوالي '+Math.max(1,Math.ceil((data.retry_after_seconds||60)/60))+' دقيقة.';if(data?.error==='account_inactive')return 'الحساب موقوف حاليًا. تواصل مع Cardfy.';if(data?.error==='subscription_expired')return 'انتهى الاشتراك الحالي. تواصل مع Cardfy لتجديد الاشتراك.';if(data?.error==='invalid_credentials'&&Number.isFinite(data.attempts_remaining))return 'الكود أو كلمة المرور غير صحيحة. المحاولات المتبقية: '+data.attempts_remaining;return 'الكود أو كلمة المرور غير صحيحة.'}
async function login(){const code=document.getElementById('code').value.trim(),p_password=document.getElementById('pass').value;const {data,error}=await sb.rpc('cfy_client_login',{p_code:code,p_password});if(error||!data?.ok){loginUI(error?'تعذر تسجيل الدخول حاليًا.':loginMessage(data));return}localStorage.setItem(TOKEN_KEY,data.token);renderHome(data)}
async function restore(){const token=localStorage.getItem(TOKEN_KEY);if(!token){loginUI();return}const {data,error}=await sb.rpc('cfy_client_session',{p_token:token});if(error){localStorage.removeItem(TOKEN_KEY);loginUI('انتهت الجلسة أو الاشتراك. سجّل الدخول من جديد.');return}renderHome(data)}
function renderHome(data){const c=data.client,active=new Set(data.services||[]),isAdmin=adminMode||data.admin_session===true;const visibleServices=Object.entries(SERVICES).filter(([k])=>active.has(k));app.innerHTML=`<div class="wrap">${isAdmin?'<div class="admin-banner">وضع دخول الإدارة: الجلسة مؤقتة ولا تحتاج معرفة كلمة مرور العميل.</div>':''}<div class="top"><div><h1>${escapeHtml(c.brand_name_ar||c.brand_name_en||c.code)}</h1><div class="muted">${escapeHtml(c.code)} · ${escapeHtml(c.business_type||'')}</div></div><button class="btn ghost" onclick="logout()">تسجيل الخروج</button></div><div class="card" style="margin-top:18px"><b>خدماتك</b>${visibleServices.length?`<div class="grid">${visibleServices.map(([k,v])=>`<a class="service" href="${v[1]}"><b>${v[0]}</b><span class="muted">الخدمة مفعلة</span></a>`).join('')}</div>`:'<div class="empty">لا توجد خدمات مفعلة على هذا الحساب حاليًا.</div>'}</div></div>`}
async function logout(){const token=localStorage.getItem(TOKEN_KEY);if(token)await sb.rpc('cfy_client_logout',{p_token:token});localStorage.removeItem(TOKEN_KEY);loginUI()}
restore();
</script></body></html>
