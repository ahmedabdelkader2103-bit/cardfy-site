<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardfy — Admin V2</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;background:#f4f6fb;color:#1c2333}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#171c2e;color:#fff;padding:24px 16px}.brand{font-size:20px;font-weight:900;margin-bottom:24px}.nav{color:#b8bfd4;padding:10px 12px;border-radius:10px}.nav.on{background:#6d4df6;color:#fff}.main{padding:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:800;cursor:pointer;background:#6d4df6;color:#fff}.btn.ghost{background:#fff;color:#5a45db;border:1px solid #e3e6f0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0}.stat,.card{background:#fff;border:1px solid #e6e9f2;border-radius:16px;padding:16px}.stat b{font-size:25px}.muted{color:#7a849b}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{padding:10px 12px;border:1px solid #dfe3ed;border-radius:10px;font:inherit}.toolbar input{min-width:260px;flex:1}.table{overflow:auto;background:#fff;border:1px solid #e6e9f2;border-radius:16px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:right;padding:12px 14px;border-bottom:1px solid #eef0f5;font-size:14px}th{color:#7a849b;background:#fafbfe}.code{font-weight:900;color:#6d4df6;direction:ltr}.services{display:flex;gap:5px;flex-wrap:wrap}.pill{font-size:11px;padding:4px 7px;border-radius:99px;background:#eef0ff;color:#5a45db}.off{background:#f1f2f5;color:#9aa0af}.login{max-width:430px;margin:12vh auto}.fld{margin:11px 0}.fld label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.fld input,.fld select{width:100%;padding:10px 12px;border:1px solid #dfe3ed;border-radius:10px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid #e3e6ef;border-radius:10px;padding:10px}.overlay{position:fixed;inset:0;background:#11182788;display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}.overlay.on{display:flex}.modal{background:#fff;width:min(720px,100%);border-radius:18px;overflow:hidden}.mh,.mf{padding:16px 20px;border-bottom:1px solid #e8eaf1;display:flex;justify-content:space-between;align-items:center}.mf{border-top:1px solid #e8eaf1;border-bottom:0;justify-content:flex-start;gap:8px}.mb{padding:18px 20px}.err{color:#c8324b;background:#fff0f3;padding:9px 10px;border-radius:9px;margin-top:10px}.badge{font-size:11px;padding:4px 8px;border-radius:99px}.active{background:#e6f8ef;color:#11875f}.soon{background:#fff5d8;color:#9a6a00}.expired{background:#ffe8ec;color:#b52b45}.inactive{background:#f1f2f5;color:#7a849b}@media(max-width:800px){.shell{display:block}.side{display:none}.main{padding:18px}.grid,.checks{grid-template-columns:1fr}}</style></head><body><div id="app"></div><div class="overlay" id="ov"><div class="modal"><div class="mh"><b id="mt">عميل</b><button class="btn ghost" onclick="closeForm()">✕</button></div><div class="mb"><input type="hidden" id="id"><div class="grid"><div class="fld"><label>الكود</label><input id="code" readonly dir="ltr"></div><div class="fld"><label>نوع النشاط</label><input id="business_type"></div><div class="fld"><label>اسم البراند عربي</label><input id="brand_name_ar"></div><div class="fld"><label>Brand Name English</label><input id="brand_name_en" dir="ltr"></div><div class="fld"><label>WhatsApp</label><input id="whatsapp" dir="ltr"></div><div class="fld"><label>الباقة</label><select id="tier"><option value="start">Start</option><option value="premium">Premium</option></select></div><div class="fld"><label>حالة الخدمة</label><select id="active"><option value="true">نشط</option><option value="false">موقوف</option></select></div><div class="fld"><label>بداية الاشتراك</label><input id="sub_start" type="date"></div><div class="fld"><label>نهاية الاشتراك</label><input id="sub_end" type="date"></div><div class="fld"><label>كلمة مرور جديدة</label><input id="password" type="password" placeholder="8 أحرف على الأقل" dir="ltr"></div></div><h3>الخدمات</h3><div class="checks"><label class="check"><input type="checkbox" id="svc_social"> Social Link</label><label class="check"><input type="checkbox" id="svc_menu"> Professional Menu</label><label class="check"><input type="checkbox" id="svc_shop"> Professional Shop</label><label class="check"><input type="checkbox" id="svc_booking"> Professional Booking</label></div><div class="muted" style="margin-top:10px;font-size:12px">الـAdmin لا يستطيع استرجاع كلمة المرور الأصلية؛ إدخال كلمة جديدة يعمل Reset لها.</div><div id="formErr"></div></div><div class="mf"><button class="btn" onclick="saveClient()">حفظ</button><button class="btn ghost" onclick="closeForm()">إلغاء</button></div></div></div><script>
const SUPA_URL='https://ytixcczbjmjnuotzavbb.supabase.co',SUPA_KEY='sb_publishable_0j9jf0boDrMGGO8S6mw-4Q_5bOeHIuU';const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);let clients=[];const app=document.getElementById('app');
function loginUI(){app.innerHTML=`<div class="main"><div class="card login"><h1>Cardfy Admin</h1><p class="muted">سجّل الدخول بحساب الإدارة على Supabase.</p><div class="fld"><label>البريد الإلكتروني</label><input id="email" dir="ltr"></div><div class="fld"><label>كلمة المرور</label><input id="pass" type="password" dir="ltr"></div><button class="btn" onclick="login()">دخول</button><div id="loginErr"></div></div></div>`}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;const r=await sb.auth.signInWithPassword({email,password});if(r.error){document.getElementById('loginErr').innerHTML='<div class="err">بيانات الدخول غير صحيحة.</div>';return}await load()}
async function logout(){await sb.auth.signOut();loginUI()}
async function boot(){const {data}=await sb.auth.getSession();if(!data.session){loginUI();return}await load()}
async function load(){const r=await sb.rpc('cfy_admin_list_clients');if(r.error){app.innerHTML='<div class="main"><div class="err">تعذر تحميل العملاء: '+esc(r.error.message)+'</div></div>';return}clients=r.data||[];render()}
function status(c){if(!c.active)return'inactive';if(!c.sub_end)return'active';const today=new Date();today.setHours(0,0,0,0);const end=new Date(c.sub_end+'T00:00:00');if(end<today)return'expired';if(end-today<=7*86400000)return'soon';return'active'}
function statusBadge(c){const s=status(c),labels={active:'نشط',soon:'ينتهي قريبًا',expired:'منتهي',inactive:'موقوف'};return `<span class="badge ${s}">${labels[s]||s}</span>`}
function render(){const q=(document.getElementById('q')?.value||'').toLowerCase(),f=document.getElementById('filter')?.value||'';const list=clients.filter(c=>(!q||[c.code,c.brand_name_ar,c.brand_name_en,c.whatsapp,c.business_type].join(' ').toLowerCase().includes(q))&&(!f||status(c)===f));app.innerHTML=`<div class="shell"><aside class="side"><div class="brand">CARDfy</div><div class="nav on">👥 العملاء</div><div class="nav">🔐 الحسابات والخدمات</div></aside><main class="main"><div class="top"><div><h1 style="margin:0">إدارة العملاء</h1><div class="muted">Core Architecture V2 — العميل منفصل عن محتوى الخدمات</div></div><div><button class="btn" onclick="openNew()">＋ عميل جديد</button> <button class="btn ghost" onclick="logout()">خروج</button></div></div><div class="stats"><div class="stat"><b>${clients.length}</b><div class="muted">إجمالي العملاء</div></div><div class="stat"><b>${clients.filter(c=>['active','soon'].includes(status(c))).length}</b><div class="muted">اشتراك ساري</div></div><div class="stat"><b>${clients.filter(c=>status(c)==='expired').length}</b><div class="muted">منتهي</div></div><div class="stat"><b>${clients.filter(c=>c.services?.booking).length}</b><div class="muted">Booking</div></div></div><div class="toolbar"><input id="q" placeholder="بحث بالكود أو الاسم أو واتساب" oninput="render()" value="${esc(q)}"><select id="filter" onchange="render()"><option value="">كل الحالات</option><option value="active" ${f==='active'?'selected':''}>نشط</option><option value="soon" ${f==='soon'?'selected':''}>ينتهي قريبًا</option><option value="inactive" ${f==='inactive'?'selected':''}>موقوف</option><option value="expired" ${f==='expired'?'selected':''}>منتهي</option></select></div><div class="table"><table><thead><tr><th>الكود</th><th>العميل</th><th>النشاط</th><th>واتساب</th><th>الخدمات</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${list.map(c=>`<tr><td><span class="code">${esc(c.code)}</span></td><td><b>${esc(c.brand_name_ar||'')}</b><div class="muted">${esc(c.brand_name_en||'')}</div></td><td>${esc(c.business_type||'')}</td><td dir="ltr">${esc(c.whatsapp||'')}</td><td><div class="services">${['social','menu','shop','booking'].map(s=>`<span class="pill ${c.services?.[s]?'':'off'}">${s}</span>`).join('')}</div></td><td>${statusBadge(c)}</td><td><button class="btn ghost" onclick="edit('${c.id}')">تعديل</button> <button class="btn" onclick="accessClient('${c.id}')">دخول</button></td></tr>`).join('')}</tbody></table></div></main></div>`}
async function openNew(){clearForm();document.getElementById('mt').textContent='إضافة عميل';const r=await sb.rpc('cfy_next_client_code');if(r.error){alert('تعذر توليد كود العميل.');return}document.getElementById('code').value=r.data||'';const t=new Date();document.getElementById('sub_start').value=t.toISOString().slice(0,10);t.setMonth(t.getMonth()+3);document.getElementById('sub_end').value=t.toISOString().slice(0,10);document.getElementById('svc_social').checked=true;document.getElementById('ov').classList.add('on')}
function edit(id){const c=clients.find(x=>x.id===id);if(!c)return;clearForm();document.getElementById('mt').textContent='تعديل '+c.code;for(const k of ['id','code','business_type','brand_name_ar','brand_name_en','whatsapp','tier','sub_start','sub_end'])document.getElementById(k).value=c[k]||'';document.getElementById('active').value=String(c.active);['social','menu','shop','booking'].forEach(s=>document.getElementById('svc_'+s).checked=!!c.services?.[s]);document.getElementById('ov').classList.add('on')}
function clearForm(){for(const id of ['id','code','business_type','brand_name_ar','brand_name_en','whatsapp','sub_start','sub_end','password'])document.getElementById(id).value='';document.getElementById('tier').value='start';document.getElementById('active').value='true';['social','menu','shop','booking'].forEach(s=>document.getElementById('svc_'+s).checked=false);document.getElementById('formErr').innerHTML=''}
function closeForm(){document.getElementById('ov').classList.remove('on')}
async function saveClient(){const p_client={id:val('id')||null,code:val('code'),business_type:val('business_type'),brand_name_ar:val('brand_name_ar'),brand_name_en:val('brand_name_en'),whatsapp:val('whatsapp'),tier:val('tier'),active:val('active')==='true',sub_start:val('sub_start'),sub_end:val('sub_end')};if(!p_client.brand_name_ar){document.getElementById('formErr').innerHTML='<div class="err">اكتب اسم البراند بالعربي.</div>';return}const p_services={};['social','menu','shop','booking'].forEach(s=>p_services[s]=document.getElementById('svc_'+s).checked);const p_password=val('password')||null;const r=await sb.rpc('cfy_admin_save_client',{p_client,p_services,p_password});if(r.error){document.getElementById('formErr').innerHTML='<div class="err">'+esc(r.error.message)+'</div>';return}closeForm();await load()}
async function accessClient(id){const r=await sb.rpc('cfy_admin_create_client_session',{p_client_id:id});if(r.error||!r.data?.token){alert('تعذر فتح حساب العميل.');return}localStorage.setItem('cardfy_client_token_v1',r.data.token);window.open('/client-dashboard.html?admin=1','_blank','noopener')}
function val(id){return document.getElementById(id).value.trim()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}boot();
</script></body></html>
