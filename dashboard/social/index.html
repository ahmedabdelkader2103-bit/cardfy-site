<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardfy — Social Link</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/dashboard/common/cardfy-assets.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;background:#f5f6fb;color:#20243a}.wrap{max-width:920px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid #e7e9f2;border-radius:18px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.fld label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.fld input,.fld textarea{width:100%;padding:11px 12px;border:1px solid #dfe2ec;border-radius:10px;font:inherit}.fld textarea{min-height:90px}.btn{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:800;cursor:pointer;background:#6d4df6;color:#fff}.btn.ghost{background:#eef0ff;color:#5a45db}.btn.bad{background:#fff0f3;color:#bf334c}.msg{margin-top:10px;font-size:13px}.muted{color:#7b8499}.assets{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:start}.logo-box{width:160px;height:160px;border:1px dashed #ccd1df;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafbfe}.logo-box img{width:100%;height:100%;object-fit:cover}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}.thumb{position:relative;border:1px solid #e5e8f0;border-radius:12px;overflow:hidden;aspect-ratio:1/1;background:#fafbfe}.thumb img{width:100%;height:100%;object-fit:cover}.thumb button{position:absolute;top:5px;left:5px;border:0;border-radius:8px;background:#fff;color:#c8324b;padding:5px 7px;cursor:pointer}@media(max-width:650px){.assets{grid-template-columns:1fr}.logo-box{width:130px;height:130px}}</style></head><body><div class="wrap"><div class="top"><div><h1>Social Link</h1><div class="muted" id="who"></div></div><div><a class="btn ghost" href="/client-dashboard.html" style="text-decoration:none">رجوع للخدمات</a></div></div><div class="card"><h3>المحتوى والروابط</h3><div class="grid"><div class="fld"><label>الوصف / Tagline</label><input id="tagline"></div><div class="fld"><label>Facebook</label><input id="facebook" dir="ltr"></div><div class="fld"><label>Instagram</label><input id="instagram" dir="ltr"></div><div class="fld"><label>TikTok</label><input id="tiktok" dir="ltr"></div><div class="fld"><label>Website</label><input id="website" dir="ltr"></div><div class="fld"><label>Map Link</label><input id="map_link" dir="ltr"></div><div class="fld"><label>InstaPay</label><input id="instapay" dir="ltr"></div><div class="fld"><label>Vodafone Cash</label><input id="vodafone_cash" dir="ltr"></div></div></div><div class="card"><h3>الشعار والصور</h3><div class="assets"><div><div class="logo-box" id="logoBox"><span class="muted">لا يوجد شعار</span></div><input type="file" id="logoFile" accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml" hidden onchange="uploadLogo(this.files[0])"><button class="btn ghost" style="margin-top:10px" onclick="logoFile.click()">رفع شعار</button></div><div><div class="muted">معرض الصور — الصور تُرفع إلى Supabase Storage بدل Base64.</div><input type="file" id="galleryFile" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden onchange="uploadGallery(this.files)"><button class="btn ghost" style="margin-top:10px" onclick="galleryFile.click()">＋ إضافة صور</button><div class="gallery" id="gallery"></div></div></div></div><div class="card"><button class="btn" onclick="save()">حفظ التعديلات</button><div class="msg" id="msg"></div></div></div><script>const SUPA_URL='https://ytixcczbjmjnuotzavbb.supabase.co',SUPA_KEY='sb_publishable_0j9jf0boDrMGGO8S6mw-4Q_5bOeHIuU',sb=window.supabase.createClient(SUPA_URL,SUPA_KEY),TK='cardfy_client_token_v1';const ids=['tagline','facebook','instagram','tiktok','website','map_link','instapay','vodafone_cash'];let social={gallery:[],design:{},card:{}};function token(){return localStorage.getItem(TK)||''}function setMsg(x){document.getElementById('msg').textContent=x}function renderAssets(){const box=document.getElementById('logoBox'),logo=social.design?.logo||'';box.innerHTML=logo?`<img src="${logo}" alt="logo">`:'<span class="muted">لا يوجد شعار</span>';document.getElementById('gallery').innerHTML=(social.gallery||[]).map((g,i)=>{const src=typeof g==='string'?g:g.src||g.url||'';return `<div class="thumb"><img src="${src}" alt=""><button onclick="removeGallery(${i})">✕</button></div>`}).join('')}async function boot(){const t=token();if(!t){location='/client-dashboard.html';return}const s=await sb.rpc('cfy_client_session',{p_token:t});if(s.error||!(s.data.services||[]).includes('social')){location='/client-dashboard.html';return}document.getElementById('who').textContent=s.data.client.code+' · '+(s.data.client.brand_name_ar||'');const r=await sb.rpc('cfy_social_get',{p_token:t});if(r.error){setMsg('تعذر تحميل البيانات');return}social=Object.assign({gallery:[],design:{},card:{}},r.data||{});ids.forEach(id=>document.getElementById(id).value=social[id]||'');renderAssets()}async function uploadLogo(file){if(!file)return;try{setMsg('جاري رفع الشعار...');const r=await CardfyAssets.upload('social',file);social.design=Object.assign({},social.design||{},{logo:r.url,logo_path:r.path});renderAssets();setMsg('تم رفع الشعار. اضغط حفظ لتثبيت التغيير ✅')}catch(e){setMsg('فشل رفع الشعار: '+e.message)}finally{document.getElementById('logoFile').value=''}}async function uploadGallery(files){try{for(const f of Array.from(files||[])){setMsg('جاري رفع الصور...');const r=await CardfyAssets.upload('social',f);social.gallery.push({src:r.url,path:r.path,bucket:r.bucket,caption:''})}renderAssets();setMsg('تم رفع الصور. اضغط حفظ لتثبيت التغيير ✅')}catch(e){setMsg('فشل رفع صورة: '+e.message)}finally{document.getElementById('galleryFile').value=''}}async function removeGallery(i){const g=social.gallery[i];if(!g)return;if(g.path&&g.bucket){try{await CardfyAssets.remove(g.bucket,g.path)}catch(e){}}social.gallery.splice(i,1);renderAssets();setMsg('تم حذف الصورة من المعرض. اضغط حفظ ✅')}async function save(){const p_data={gallery:social.gallery||[],design:social.design||{},card:social.card||{}};ids.forEach(id=>p_data[id]=document.getElementById(id).value.trim());const r=await sb.rpc('cfy_social_save',{p_token:token(),p_data});setMsg(r.error?'تعذر الحفظ':'تم الحفظ ✅')}boot();</script></body></html>
