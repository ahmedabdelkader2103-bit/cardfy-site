<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardfy — Social Link</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;background:#f5f6fb;color:#20243a}.wrap{max-width:920px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid #e7e9f2;border-radius:18px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.fld label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.fld input,.fld textarea{width:100%;padding:11px 12px;border:1px solid #dfe2ec;border-radius:10px;font:inherit}.fld textarea{min-height:90px}.btn{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:800;cursor:pointer;background:#6d4df6;color:#fff}.btn.ghost{background:#eef0ff;color:#5a45db}.msg{margin-top:10px;font-size:13px}.muted{color:#7b8499}</style></head><body><div class="wrap"><div class="top"><div><h1>Social Link</h1><div class="muted" id="who"></div></div><div><a class="btn ghost" href="/client-dashboard.html" style="text-decoration:none">رجوع للخدمات</a></div></div><div class="card"><div class="grid"><div class="fld"><label>الوصف / Tagline</label><input id="tagline"></div><div class="fld"><label>Facebook</label><input id="facebook" dir="ltr"></div><div class="fld"><label>Instagram</label><input id="instagram" dir="ltr"></div><div class="fld"><label>TikTok</label><input id="tiktok" dir="ltr"></div><div class="fld"><label>Website</label><input id="website" dir="ltr"></div><div class="fld"><label>Map Link</label><input id="map_link" dir="ltr"></div><div class="fld"><label>InstaPay</label><input id="instapay" dir="ltr"></div><div class="fld"><label>Vodafone Cash</label><input id="vodafone_cash" dir="ltr"></div></div><button class="btn" style="margin-top:16px" onclick="save()">حفظ التعديلات</button><div class="msg" id="msg"></div></div></div><script>const SUPA_URL='https://ytixcczbjmjnuotzavbb.supabase.co',SUPA_KEY='sb_publishable_0j9jf0boDrMGGO8S6mw-4Q_5bOeHIuU',sb=window.supabase.createClient(SUPA_URL,SUPA_KEY),TK='cardfy_client_token_v1';const ids=['tagline','facebook','instagram','tiktok','website','map_link','instapay','vodafone_cash'];async function boot(){const t=localStorage.getItem(TK);if(!t){location='/client-dashboard.html';return}const s=await sb.rpc('cfy_client_session',{p_token:t});if(s.error||!(s.data.services||[]).includes('social')){location='/client-dashboard.html';return}document.getElementById('who').textContent=s.data.client.code+' · '+(s.data.client.brand_name_ar||'');const r=await sb.rpc('cfy_social_get',{p_token:t});if(r.error){document.getElementById('msg').textContent='تعذر تحميل البيانات';return}ids.forEach(id=>document.getElementById(id).value=r.data[id]||'')}async function save(){const t=localStorage.getItem(TK),p_data={};ids.forEach(id=>p_data[id]=document.getElementById(id).value.trim());const r=await sb.rpc('cfy_social_save',{p_token:t,p_data});document.getElementById('msg').textContent=r.error?'تعذر الحفظ':'تم الحفظ ✅'}boot();</script></body></html>
