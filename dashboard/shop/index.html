<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardfy — Professional Shop</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Tajawal,Arial,sans-serif;background:#f5f6fb;color:#20243a}.wrap{max-width:780px;margin:8vh auto;padding:24px}.card{background:#fff;border:1px solid #e7e9f2;border-radius:18px;padding:26px;box-shadow:0 10px 30px rgba(25,30,55,.06)}a{display:inline-block;margin-top:14px;text-decoration:none;background:#eef0ff;color:#5a45db;padding:10px 14px;border-radius:10px;font-weight:800}.muted{color:#7b8499;line-height:1.8}.ok{background:#e9f9f1;color:#137552;padding:10px 12px;border-radius:10px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.item{border:1px solid #e7e9f2;border-radius:12px;padding:12px}</style></head><body><div class="wrap"><div class="card"><h1>Professional Shop</h1><div id="status" class="muted">جاري التحقق من الخدمة...</div><div id="body" style="display:none"><p class="ok">Backend V1 جاهز ومربوط بحساب العميل.</p><div class="grid"><div class="item">التصنيفات والمنتجات</div><div class="item">Variants & Options</div><div class="item">المخزون وSKU</div><div class="item">السلة</div><div class="item">العملاء</div><div class="item">الطلبات وحالاتها</div></div><p class="muted">واجهة إدارة المتجر الكاملة لم تُبنَ بعد؛ هذه الصفحة تؤكد أن البنية الخلفية الحقيقية موجودة ومتصلة بالحساب.</p><div class="muted" id="orders"></div></div><a href="/client-dashboard.html">رجوع للخدمات</a></div></div><script>const sb=window.supabase.createClient('https://ytixcczbjmjnuotzavbb.supabase.co','sb_publishable_0j9jf0boDrMGGO8S6mw-4Q_5bOeHIuU'),TK='cardfy_client_token_v1';(async()=>{const t=localStorage.getItem(TK);if(!t){location='/client-dashboard.html';return}const s=await sb.rpc('cfy_client_session',{p_token:t});if(s.error||!(s.data.services||[]).includes('shop')){location='/client-dashboard.html';return}document.getElementById('status').textContent=s.data.client.code+' · '+(s.data.client.brand_name_ar||'');document.getElementById('body').style.display='block';const r=await sb.rpc('cfy_shop_client_orders',{p_token:t,p_status:null});document.getElementById('orders').textContent=r.error?'تعذر قراءة الطلبات الآن':'عدد الطلبات الحالية: '+(r.data||[]).length})()</script></body></html>
